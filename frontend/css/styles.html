<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

    /* #style.css */

    /* *Propiedades personalizadas */

    body.main-mode {
        /* colors */
        --spanish-gray:    hsl(0, 0%, 60%);
        --sonic-silver:    hsl(0, 0%, 47%);
        --eerie-black:     hsl(0, 0%, 13%);
        --dark-text:       hsl(0, 0%, 10%);
        --deep-black:      hsl(0, 0%, 8%);
        --dark-gray:       hsl(0, 0%, 22%);
        --text-dark:       hsl(0, 0%, 16%);
        --charcoal:        hsl(0, 0%, 25%);

        --soft-coral:      hsl(353, 100%, 76%);
        --salmon-pink:     hsl(353, 100%, 78%);
        --soft-pink:       hsl(353, 70%, 85%);
        --pastel-pink:     hsl(353, 60%, 88%);
        --light-pink:      hsl(353, 50%, 90%);
        --blush-pink:      hsl(353, 40%, 92%);
        --pale-pink:       hsl(353, 35%, 94%);
        --baby-pink:       hsl(353, 30%, 95%);

        --sandy-brown:     hsl(29, 90%, 65%);
        --bittersweet:     hsl(0, 100%, 70%);
        --ocean-green:     hsl(152, 51%, 52%);

        --davys-gray:      hsl(0, 0%, 33%);

        --cultured:        hsl(0, 0%, 93%);
        --cultured-dark:   hsl(0, 0%, 88%);
        --cultured-darker: hsl(0, 0%, 82%);

        --white:           hsl(0, 0%, 100%);

        --onyx:            hsl(0, 0%, 27%);
        --onyx-dark:       hsl(0, 0%, 20%);
        --onyx-darker:     hsl(0, 0%, 17%);
        --onyx-very-dark:  hsl(0, 0%, 14%);
        --onyx-black:      hsl(0, 0%, 5%);

        /* typography */

        --fs-1: 1.563rem;
        --fs-2: 1.375rem;
        --fs-3: 1.25rem;
        --fs-4: 1.125rem;
        --fs-5: 1rem;
        --fs-6: 0.938rem;
        --fs-7: 0.875rem;
        --fs-8: 0.813rem;
        --fs-9: 0.75rem;
        --fs-10: 0.688rem;
        --fs-11: 0.625rem;

        --weight-100: 100;
        --weight-200: 200;
        --weight-300: 300;
        --weight-400: 400;
        --weight-500: 500;
        --weight-600: 600;
        --weight-700: 700;

        /* border-radius */

        --border-radius-md: 10px;
        --border-radius-sm: 5px;

        /* transition */

        --transition-timing: 0.2s ease;
    }

    /* #RESET */

    body.application-loading #content {
        visibility: hidden;
    }

    body.main-mode *,
    body.main-mode *::before,
    body.main-mode *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body.main-mode {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: var(--white);
    }

    body.main-mode a { text-decoration: none; }

    body.main-mode li { list-style: none; }

    body.main-mode button {
        background: none;
        font: inherit;
        border: none;
        cursor: pointer;
    }

    body.main-mode img,
    body.main-mode svg,
    body.main-mode button,
    body.main-mode a {
        display: block;
    }

    body.main-mode span { display: inline-block; }

    html:has(body.main-mode) {
        overscroll-behavior: contain;
    }

    body.main-mode {
        font-family: "Poppins", sans-serif;
        background: var(--white);
    }

    body.main-mode select {
        outline: none;
    }

    body.main-mode input {
        display: block;
        width: 100%;
        font: inherit;
        outline: none;
    }

    body.main-mode input::placeholder {
        font: inherit;
    }

    /* scrollbar style */

    body.main-mode::-webkit-scrollbar {
        width: 2px;
    }

    body.main-mode::-webkit-scrollbar-track {
        background: var(--white);
    }

    body.main-mode::-webkit-scrollbar-thumb {
        background: var(--onyx-darker);
        border-radius: 10px;
    }

    /* #REUSED STYLE */

    body.main-mode header {
        margin-bottom: 10px;
    }

    body.main-mode .container {
        padding: 0 15px;
    }

    body.main-mode .has-scrollbar {
        padding-bottom: 2px;
    }

    body.main-mode .has-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    body.main-mode .has-scrollbar::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 20px;
    }

    body.main-mode .has-scrollbar:hover::-webkit-scrollbar-thumb {
        background: var(--sonic-silver);
    }

    body.main-mode .title {
        font-size: var(--fs-4);
        font-weight: var(--weight-400);
        color: var(--onyx-darker);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 18px;
    }

    /* #MAIN */

    /* overlay */

    body.main-mode .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: hsla(0, 0%, 0%, 0.5);
        opacity: 0;
        pointer-events: none;
        z-index: 15;
        transition: 0.5s ease;
    }

    body.main-mode .overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    /* MODAL */

    body.main-mode .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: hsla(0, 0%, 0%, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 10;
        animation: popup 1s ease-in-out 5s forwards;
    }

    @keyframes popup {
        0% {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        100% {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
    }

    body.main-mode .modal.closed {
        display: none;
    }

    body.main-mode .modal-close-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    body.main-mode .newsletter-img {
        display: none;
    }

    body.main-mode .modal-content {
        position: relative;
        max-width: 350px;
        margin: 20px;
        background: var(--white);
        border-radius: var(--border-radius-md);
        overflow: hidden;
        z-index: 2;
        animation: scaleUp 0.5s ease-in-out 5s forwards;
    }

    @keyframes scaleUp {

        0% {
            transform: scale(0.9);
        }

        100% {
            transform: scale(1);
        }

    }

    body.main-mode .modal-close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        background: var(--white);
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
        font-size: 18px;
        font-weight: var(--weight-500);
        padding: 5px;
        border-radius: var(--border-radius-sm);
    }

    body.main-mode .modal-close-btn:hover {
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
    }

    body.main-mode .modal-close-btn svg {
        stroke-width: 2px;
    }

    body.main-mode .newsletter {
        padding: 50px 30px;
        text-align: center;
    }

    body.main-mode .newsletter-header {
        margin-bottom: 20px;
    }

    body.main-mode .newsletter-title {
        color: var(--eerie-black);
        font-size: var(--fs-2);
        font-weight: var(--weight-300);
        margin-bottom: 10px;
    }

    body.main-mode .newsletter-desc {
        color: var(--sonic-silver);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        line-height: 1.6;
        letter-spacing: 0.3px;
    }

    body.main-mode .newsletter-desc span {
        font-weight: var(--weight-300);
    }

    body.main-mode .email-field {
        font-size: var(--fs-7);
        letter-spacing: 0.3px;
        padding: 8px 16px;
        font-weight: var(--weight-300);
        border-radius: var(--border-radius-sm);
        border: 1px solid var(--cultured-darker);
        margin-bottom: 16px;
    }

    body.main-mode .btn-newsletter {
        background: var(--white);
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
        font-size: var(--fs-8);
        font-weight: var(--weight-400);
        text-transform: uppercase;
        padding: 10px 15px;
        border-radius: var(--border-radius-sm);
        margin: auto;
        transition: var(--transition-timing);
    }

    body.main-mode .btn-newsletter:hover {
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
    }

    /* NOTIFICATION TOAST */

    body.main-mode .notification-toast {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: var(--white);
        max-width: 300px;
        margin-left: auto;
        border: 1px solid var(--cultured-dark);
        display: flex;
        align-items: flex-start;
        gap: 15px;
        padding: 15px;
        border-radius: var(--border-radius-md);
        box-shadow: 0 5px 20px hsla(0, 0%, 0%, 0.15);
        transform: translateX(calc(100% + 40px));
        transition: 0.5s ease-in-out;
        z-index: 5;
        animation: slideInOut 35s ease-in-out 1;
    }

    @keyframes slideInOut {
        0%,
        45%,
        100% {
            transform: translateX(calc(100% - 40px));
            opacity: 0;
            visibility: hidden;
        }

        50%,
        95% {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }
    }

    @keyframes slideInOut {
        0% {
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            visibility: hidden;
        }

        10% {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }

        90% {
            transform: translateX(calc(100% - 40px));
            opacity: 0;
            visibility: hidden;
        }

        100% {
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            visibility: hidden;
        }
    }

    body.main-mode .notification-toast.closed {
        display: none;
    }

    body.main-mode .toast-close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        color: var(--sonic-silver);
    }

    body.main-mode .toast-close-btn svg {
        stroke-width: 2px;
    }

    body.main-mode .toast-banner {
        width: 70px;
        height: 70px;
        border: 1px solid var(--cultured);
        border-radius: var(--border-radius-sm);
    }

    body.main-mode .toast-banner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
    }

    body.main-mode .toast-detail {
        width: calc(100% - 85px);
        padding-right: 10px;
    }

    body.main-mode .toast-title {
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
    }

    body.main-mode .toast-message {
        font-size: var(--fs-10);
        color: var(--onyx-darker);
        font-weight: var(--weight-300);
        margin-bottom: 8px;
    }

    /* #HEADER */

    body.main-mode .header-top,
    body.main-mode .header-user-actions,
    body.main-mode .desktop-navigation-menu {
        display: none;
    }

    body.main-mode .header-top {
        background: var(--light-pink);
    }

    body.main-mode .header-top .container {
        max-width: 100%;
        width: 100%;
        margin: 0;
    }

    body.main-mode .header-main {
        padding: 20px 0;
        border: 1px solid var(--cultured);
    }

    body.main-mode .header-logo {
        margin-bottom: 20px;
    }

    body.main-mode .header-logo img {
        margin: auto;
    }

    body.main-mode .header-search-container {
        position: relative;
    }

    body.main-mode .header-search-container .search-field {
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        padding: 10px 15px;
        padding-right: 50px;
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
    }

    body.main-mode .search-field::-webkit-search-cancel-button {
        display: none;
    }

    body.main-mode .search-btn {
        background: var(--white);
        position: absolute;
        top: 50%;
        right: 2px;
        transform: translateY(-50%);
        color: var(--onyx);
        font-size: 18px;
        padding: 8px 15px;
        transition: color var(--transition-timing);
    }

    body.main-mode .search-btn:hover {
        color: var(--salmon-pink);
    }

    body.main-mode .mobile-bottom-navigation {
        background: var(--eerie-black);
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 500px;
        margin: auto;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 5px 0;
        box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.25);
        z-index: 5;
    }

    body.main-mode .mobile-bottom-navigation .action-btn {
        position: relative;
        font-size: 26px;
        color: var(--white);
        padding: 10px;
        font-weight: var(--weight-400);
    }

    body.main-mode .mobile-bottom-navigation .action-btn.active {
        color: var(--soft-coral);
    }

    body.main-mode .mobile-bottom-navigation .count {
        background: var(--soft-coral);
        color: var(--white);
        position: absolute;
        top: 0;
        right: 0;
        font-size: 10px;
        font-weight: var(--weight-300);
        line-height: 1;
        padding: 2px 4px;
        border-radius: 10px;
    }

    body.main-mode .mobile-navigation-menu {
        background: var(--pastel-pink);
        position: fixed;
        top: 0;
        left: -100%;
        width: 100%;
        max-width: 360px;
        height: 100vh;
        padding: 20px;
        box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.1);
        overflow-y: scroll;
        overscroll-behavior: contain;
        visibility: hidden;
        transition: 0.5s ease;
        z-index: 20;
    }

    /* -------------------------------------------------- */

    /* .mobile-navigation-menu::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    .mobile-navigation-menu::-webkit-scrollbar-track {
        background: transparent;
    }

    .mobile-navigation-menu::-webkit-scrollbar-thumb {
        background: var(--salmon-pink);
        border-radius: 10px;
    }

    .mobile-navigation-menu::-webkit-scrollbar-thumb:hover {
        background: var(--salmon-pink);
    } */

    /* -------------------------------------------------- */

    body.main-mode .mobile-navigation-menu.active {
        left: 0;
        visibility: visible;
    }

    body.main-mode .menu-top {
        padding-bottom: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--soft-pink);
    }

    body.main-mode .menu-top .menu-title {
        color: var(--soft-coral);
        font-size: var(--fs-4);
        font-weight: var(--weight-600);
        text-transform: uppercase;
    }

    body.main-mode .menu-close-btn {
        color: var(--onyx-black);
        font-size: 22px;
    }

    body.main-mode .menu-close-btn svg {
        stroke-width: 2px;
    }

    body.main-mode .mobile-menu-category-list {
        margin-bottom: 30px;
    }

    body.main-mode .menu-category .accordion-menu {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    body.main-mode .mobile-menu-category-list .menu-category {
        border-bottom: 1px solid var(--soft-pink);
    }

    body.main-mode .mobile-menu-category-list .menu-title {
        color: var(--onyx-black);
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        padding: 12px 0;
        text-transform: uppercase;
    }

    body.main-mode .accordion-menu > div {
        font-size: 14px;
    }

    body.main-mode .accordion-menu svg {
        color: var(--onyx-black);
        width: 18px;
        height: 18px;
    }

    body.main-mode .accordion-menu.active .add-icon,
    body.main-mode .accordion-menu .remove-icon {
        display: none;
    }

    body.main-mode .accordion-menu .add-icon,
    body.main-mode .accordion-menu.active .remove-icon {
        display: block;
    }

    body.main-mode .menu-category .submenu-category-list {
        margin-left: 10px;
    }

    body.main-mode .submenu-title {
        padding: 6px 0;
        font-size: var(--fs-7);
        color: var(--onyx);
        font-weight: var(--weight-300);
        text-transform: uppercase;
    }

    body.main-mode .submenu-title:hover {
        color: var(--davys-gray);
    }

    body.main-mode .submenu-category-list {
        max-height: 0;
        overflow: hidden;
        visibility: hidden;
        transition: 0.5s ease-in-out;
    }

    body.main-mode .submenu-category-list.active {
        max-height: 1000px;
        visibility: visible;
    }

    body.main-mode .menu-bottom .menu-category-list {
        margin-bottom: 20px;
    }

    body.main-mode .menu-bottom .menu-category {
        border-bottom: none;
    }

    body.main-mode .menu-bottom .menu-title {
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
        text-transform: uppercase;
        padding: 12px 0;
    }

    body.main-mode .accordion-menu.active .caret-back {
        transform: rotate(-0.25turn);
    }

    body.main-mode .menu-bottom .submenu-category-list {
        padding: 0 15px;
        margin-left: 0;
    }

    body.main-mode .menu-bottom .submenu-category:not(:last-child) {
        border-bottom: 1px solid var(--salmon-pink);
    }

    body.main-mode .menu-social-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    body.main-mode .menu-social-container .social-link {
        background: var(--pastel-pink);
        color: var(--sonic-silver);
        font-size: 14px;
        padding: 5px;
    }

    /* #BANNER */

    body.main-mode .banner {
        margin: 30px 0;
    }

    body.main-mode .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: auto hidden;
        scroll-snap-type: inline mandatory;
        overscroll-behavior-inline: contain;
    }

    body.main-mode .slider-item {
        position: relative;
        min-width: 100%;
        max-height: 450px;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        scroll-snap-align: start;
    }

    body.main-mode .slider-item .banner-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right;
    }

    body.main-mode .banner-content {
        background: hsla(0, 0%, 100%, 0.8);
        position: absolute;
        bottom: 25px;
        left: 25px;
        right: 25px;
        padding: 20px 25px;
        border-radius: var(--border-radius-md);
    }

    body.main-mode .banner-subtitle {
        color: var(--salmon-pink);
        font-size: var(--fs-7);
        font-weight: var(--weight-500);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    body.main-mode .banner-title {
        color: var(--eerie-black);
        font-size: var(--fs-1);
        text-transform: uppercase;
        line-height: 1;
        margin-bottom: 10px;
    }

    body.main-mode .banner-text {
        display: none;
    }

    body.main-mode .banner-btn {
        background: var(--white);
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
        width: max-content;
        font-size: var(--fs-9);
        font-weight: var(--weight-600);
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: var(--border-radius-sm);
        transition: var(--transition-timing);
    }

    body.main-mode .banner-btn:hover {
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
    }

    /* #CATEGORY */

    body.main-mode .category {
        margin-bottom: 30px;
    }

    body.main-mode .category-item-container {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        overflow: auto hidden;
        scroll-snap-type: inline mandatory;
        overscroll-behavior-inline: contain;
        padding: 30px 10px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    body.main-mode .category-item-container::-webkit-scrollbar {
        display: none;
    }

    body.main-mode .category-item {
        min-width: auto;
        flex: 0 0 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 0 5px;
        border: none;
        border-radius: 0;
        scroll-snap-align: start;
        background: transparent;
        box-shadow: none;
    }

    body.main-mode .category-img-box {
        background: var(--white);
        border: 2px solid var(--salmon-pink);
        padding: 0;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.main-mode .category-item:hover .category-img-box {
        border: 2px solid var(--eerie-black);
    }

    body.main-mode .category-img-box img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: invert(58%) sepia(15%) saturate(1434%) hue-rotate(314deg) brightness(95%) contrast(85%);
    }

    body.main-mode .category-item:hover .category-img-box img {
        filter: brightness(0);
    }

    body.main-mode .category-content-box {
        width: 100%;
        text-align: center;
    }

    body.main-mode .category-content-flex {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        margin-bottom: 0;
    }

    body.main-mode .category-item-title {
        color: var(--eerie-black);
        font-size: 0.8rem;
        font-weight: var(--weight-300);
        text-transform: uppercase;
        margin: 0;
        line-height: 1.3;
        letter-spacing: 0.5px;
    }

    body.main-mode .category-item-amount,
    body.main-mode .category-btn {
        display: none;
    }

    /* #PRODUCT FEATURED */

    body.main-mode .product-featured {
        margin-bottom: 30px;

        overflow: hidden;
    }

        width: 100%;
        height: 250px;
        display: block;
        object-fit: cover;
        transition: var(--transition-timing);

    body.main-mode .product-grid .product-img.hover {

        left: 0;

    body.main-mode .product-grid .showcase-banner:hover .showcase-actions {

    body.main-mode .product-grid .btn-action {
        background: var(--light-pink);
        color: var(--sonic-silver);

        border: 1px solid var(--light-pink);

        transition: var(--transition-timing);
    }

    body.main-mode .product-grid .btn-action:hover {
        background: var(--white);
        color: var(--sonic-silver);
        border-color: var(--sonic-silver);
    }

    body.main-mode .product-grid .showcase-content {

    body.main-mode .product-grid .showcase-category {

        text-transform: uppercase;

    body.main-mode .product-grid .showcase-title {
        color: var(--sonic-silver);
        font-size: var(--fs-7);
        text-align: center;
        font-weight: var(--weight-400);
        text-transform: uppercase;

        margin-bottom: 1px;
    }

    body.main-mode .product-grid .price-box {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;

        font-weight: var(--weight-300);
        color: var(--text-dark);
        margin-bottom: 3px;

    body.main-mode .product-grid .price {
        font-weight: var(--weight-300);
    }

    body.main-mode .product-grid del {

    body.main-mode .product-grid .add-cart-btn {

        font-weight: var(--weight-400);
        border: 0.2px solid var(--light-pink);

    body.main-mode .product-grid .add-cart-btn:hover {

    body.main-mode .testimonial {

        align-items: flex-start;

        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
    }

    body.main-mode .testimonial-card {
        position: relative;

        min-height: 290px;
        padding: 18px 18px 25px;
        border: 1px solid var(--cultured-darker);

        border-radius: 50%;

    body.main-mode .testimonial-title {

        text-align: left;

    body.main-mode .blog {
        margin-bottom: 30px;
    }

    body.main-mode .blog-container {
        display: flex;
        align-items: flex-start;

        scroll-snap-type: inline mandatory;
    }

    body.main-mode .blog-title:hover {

    }

    body.main-mode .blog-meta {

        font-size: var(--fs-7);

    }

    body.main-mode .blog-meta cite {

    /* #FOOTER */

    body.main-mode footer {
        background: var(--light-pink);

    }

    body.main-mode .footer-nav {
        border-bottom: 1px solid var(--onyx);
        padding-bottom: 10px;
        margin-bottom: 10px;
    }

    body.main-mode .logo-img {

        height: auto;
        margin-bottom: 12px;
    }

    body.main-mode .footer-nav-item .content-text {

        font-weight: var(--weight-300);

    }

        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 30px;
    }

    }

    }

    body.main-mode .footer-nav .nav-title {
        position: relative;
        color: var(--onyx-black);
        font-size: var(--fs-7);
        font-weight: var(--weight-400);
        text-transform: uppercase;
        margin-bottom: 9px;
        padding-bottom: 3px;
    }

    body.main-mode .footer-nav .nav-title::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        background: var(--soft-coral);
        width: 60px;
        height: 1px;

        padding: 2px 0;

    body.main-mode .footer-nav-link,
    body.main-mode .footer-nav-item .content {
        width: max-content;
        color: var(--onyx-darker);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        transition: var(--transition-timing);
    }

    body.main-mode .footer-nav-item.flex {

        align-items: flex-start;
        gap: 10px;

    body.main-mode .footer-nav-item .content {
        font-style: normal;
        font-weight: var(--weight-300);
        margin-bottom: 5px;
    }

    body.main-mode .footer-nav-item .icon-box {
        color: var(--onyx-darker);
        font-size: 20px;
    }

    body.main-mode .footer-nav-item .icon-box svg {
        width: 20px;
        height: 20px;
    }

    body.main-mode .footer-bottom {

    }

    body.main-mode .payment-img {

    body.main-mode .copyright {

        text-transform: capitalize;
        letter-spacing: 1.2px;
    }

    body.main-mode .copyright a {
        display: inline;
        color: inherit;
    }

    /* #AUTH - REGISTRO, VERIFICACIÓN PIN Y LOGIN */

    body.main-mode .auth-section {
        padding: 30px 0;
    }

    body.main-mode .auth-card {
        max-width: 900px;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
        display: grid;
        grid-template-columns: 55% 45%;
        background: var(--white);
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
    }

    body.main-mode .auth-content {
        padding: 40px 45px;
    }

    body.main-mode .auth-card .title {
        margin-bottom: 10px;
    }

    body.main-mode .auth-desc {
        margin-bottom: 25px;
        text-align: center;
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        line-height: 1.5;
        color: var(--onyx-darker);
    }

    body.main-mode .input-group {
        margin-bottom: 12px;
    }

    body.main-mode .input-label {
        display: block;
        margin-bottom: 4px;
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
        letter-spacing: 0.3px;
    }

    body.main-mode .input-field {
        width: 100%;
        padding: 12px 15px;
        background: var(--white);
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
    }

    body.main-mode .show-password {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: -4px;
        margin-bottom: 15px;
    }

    body.main-mode .show-password input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        cursor: pointer;
        border: 1px solid var(--onyx-darker);
        border-radius: 3px;
        background: var(--white);
        display: grid;
        place-content: center;
    }

    body.main-mode .show-password input[type="checkbox"]:checked {
        background: var(--light-pink);
        border-color: var(--light-pink);
    }

    body.main-mode .show-password input[type="checkbox"]:checked::before {
        content: "✓";
        color: var(--onyx-black);
        font-size: 12px;
        font-weight: var(--weight-700);
        line-height: 1;
    }

    body.main-mode .show-password label {
        color: var(--onyx-darker);
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
        cursor: pointer;
    }

    body.main-mode .auth-error {
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 8px 15px;
        background: hsla(0, 100%, 70%, 0.1);
        border: 1px solid var(--bittersweet);
        color: var(--bittersweet);
        font-size: var(--fs-7);
        font-weight: var(--weight-400);
        text-align: center;
    }

    body.main-mode .input-field--pin {
        align-items: center;
        font-size: var(--fs-6);
        font-weight: var(--weight-400);
        letter-spacing: 8px;
    }

    body.main-mode .auth-btn {
        display: block;
        width: 100%;
        padding: 7px 18px;
        margin-bottom: 6px;
        background: var(--light-pink);
        color: var(--onyx-darker);
        border: 0.2px solid var(--light-pink);
        font-size: var(--fs-8);
        font-weight: var(--weight-400);
        text-align: center;
        text-transform: uppercase;
        cursor: pointer;
    }

    body.main-mode .opacity-btn {
        opacity: 0.5;
    }

    body.main-mode .auth-footnote {
        margin-top: 10px;
        text-align: center;
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        line-height: 1.5;
        color: var(--onyx-very-dark);
    }

    body.main-mode .auth-link {
        color: var(--salmon-pink);
        font-weight: var(--weight-400);
        display: inline;
    }

    body.main-mode .auth-link:hover {
        color: var(--onyx-darker);
        text-decoration: underline;
    }

    body.main-mode .spinner {
        margin: 2px auto;
        width: 50px;
        height: 40px;
        text-align: center;
        font-size: 10px;
    }

    body.main-mode .spinner > div {
        background-color: var(--salmon-pink);
        height: 100%;
        width: 6px;
        display: inline-block;

        -webkit-animation: sk-stretchdelay 1.2s infinite ease-in-out;
        animation: sk-stretchdelay 1.2s infinite ease-in-out;
    }

    body.main-mode .spinner .rect2 {
        -webkit-animation-delay: -1.1s;
        animation-delay: -1.1s;
    }

    body.main-mode .spinner .rect3 {
        -webkit-animation-delay: -1.0s;
        animation-delay: -1.0s;
    }

    body.main-mode .spinner .rect4 {
        -webkit-animation-delay: -0.9s;
        animation-delay: -0.9s;
    }

    body.main-mode .spinner .rect5 {
        -webkit-animation-delay: -0.8s;
        animation-delay: -0.8s;
    }

    @-webkit-keyframes sk-stretchdelay {
        0%, 40%, 100% {
            -webkit-transform: scaleY(0.4)
        }

        20% {
            -webkit-transform: scaleY(1.0)
        }
    }

    @keyframes sk-stretchdelay {
        0%, 40%, 100% {
            transform: scaleY(0.4);
            -webkit-transform: scaleY(0.4);
        }

        20% {
            transform: scaleY(1.0);
            -webkit-transform: scaleY(1.0);
        }
    }

    body.main-mode .hidden-spinner {
        display: none;
    }

    body.main-mode .auth-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100%;
        padding: 40px 20px 30px;
        background: var(--pale-pink);
    }

    body.main-mode .auth-side-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    body.main-mode .auth-logo {
        margin-bottom: 10px;
        font-size: var(--fs-2);
        font-weight: var(--weight-400);
        letter-spacing: 1px;
        text-align: center;
        color: var(--onyx-black);
    }

    body.main-mode .auth-img {
        display: block;
        width: 100%;
        max-width: 350px;
        height: auto;
        margin: 0 auto;
    }

        }

        body.main-mode .product-grid .showcase-category {
            font-size: 0.65rem;
        }

        body.main-mode .product-grid .price-box {
            font-size: 0.68rem;
            gap: 5px;
        }

        body.main-mode .product-grid .add-cart-btn {
            width: 100%;
            margin: 5px auto 15px;
            padding: 5px;
            font-size: 0.65rem;
        }
