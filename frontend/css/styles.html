<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

    /* #style.css */

    /* *Propiedades personalizadas */

    :root {
        /* colors */
        --spanish-gray:    hsl(0, 0%, 60%);
        --sonic-silver:    hsl(0, 0%, 47%);
        --eerie-black:     hsl(0, 0%, 13%);
        --dark-text:       hsl(0, 0%, 10%);
        --deep-black:      hsl(0, 0%, 8%);
        --dark-gray:       hsl(0, 0%, 22%);
        --text-dark:       hsl(0, 0%, 16%);
        --charcoal:        hsl(0, 0%, 25%);

        --soft-coral:      hsl(353, 100%, 76%);
        --salmon-pink:     hsl(353, 100%, 78%);
        --soft-pink:       hsl(353, 70%, 85%);
        --pastel-pink:     hsl(353, 60%, 88%);
        --light-pink:      hsl(353, 50%, 90%);
        --blush-pink:      hsl(353, 40%, 92%);
        --pale-pink:       hsl(353, 35%, 94%);
        --baby-pink:       hsl(353, 30%, 95%);

        --sandy-brown:     hsl(29, 90%, 65%);
        --bittersweet:     hsl(0, 100%, 70%);
        --ocean-green:     hsl(152, 51%, 52%);

        --davys-gray:      hsl(0, 0%, 33%);

        --cultured:        hsl(0, 0%, 93%);
        --cultured-dark:   hsl(0, 0%, 88%);
        --cultured-darker: hsl(0, 0%, 82%);

        --white:           hsl(0, 0%, 100%);

        --onyx:            hsl(0, 0%, 27%);
        --onyx-dark:       hsl(0, 0%, 20%);
        --onyx-darker:     hsl(0, 0%, 17%);
        --onyx-very-dark:  hsl(0, 0%, 14%);
        --onyx-black:      hsl(0, 0%, 5%);

        /* typography */

        --fs-1: 1.563rem;
        --fs-2: 1.375rem;
        --fs-3: 1.25rem;
        --fs-4: 1.125rem;
        --fs-5: 1rem;
        --fs-6: 0.938rem;
        --fs-7: 0.875rem;
        --fs-8: 0.813rem;
        --fs-9: 0.75rem;
        --fs-10: 0.688rem;
        --fs-11: 0.625rem;

        --weight-100: 100;
        --weight-200: 200;
        --weight-300: 300;
        --weight-400: 400;
        --weight-500: 500;
        --weight-600: 600;
        --weight-700: 700;

        /* border-radius */

        --border-radius-md: 10px;
        --border-radius-sm: 5px;

        /* transition */

        --transition-timing: 0.2s ease;
    }

    /* #RESET */

    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    a { text-decoration: none; }

    li { list-style: none; }

    button {
        background: none;
        font: inherit;
        border: none;
        cursor: pointer;
    }

    img, svg, button, a { display: block; }

    span { display: inline-block; }

    html {
        font-family: "Poppins", sans-serif;
        overscroll-behavior: contain;
    }

    select {
        outline: none;
    }

    input {
        display: block;
        width: 100%;
        font: inherit;
        outline: none;
    }

    input::placeholder { font: inherit; }

    body { background: var(--white); }

    /* scrollbar style */

    body::-webkit-scrollbar {
        width: 2px; 
    }

    body::-webkit-scrollbar-track {
        background: var(--white);
    }

    body::-webkit-scrollbar-thumb {
        background: var(--onyx-darker);
        border-radius: 10px;
    }

    /* #REUSED STYLE */

    header { margin-bottom: 10px; }

    .container { padding: 0 15px; }

    .has-scrollbar { padding-bottom: 2px; }

    .has-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    .has-scrollbar::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 20px;
    }

    .has-scrollbar:hover::-webkit-scrollbar-thumb { background: var(--sonic-silver); }

    .title {
        font-size: var(--fs-4);
        font-weight: var(--weight-400);
        color: var(--onyx-darker);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 18px;
    }

    /* #MAIN */

    /* overlay */

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: hsla(0, 0%, 0%, 0.5);
        opacity: 0;
        pointer-events: none;
        z-index: 15;
        transition: 0.5s ease;
    }

    .overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    /* MODAL */

    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: hsla(0, 0%, 0%, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 10;
        animation: popup 1s ease-in-out 5s forwards;
    }

    @keyframes popup {
        0% {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        100% {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
    }

    .modal.closed { display: none; }

    .modal-close-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .newsletter-img { display: none; }

    .modal-content {
        position: relative;
        max-width: 350px;
        margin: 20px;
        background: var(--white);
        border-radius: var(--border-radius-md);
        overflow: hidden;
        z-index: 2;
        animation: scaleUp 0.5s ease-in-out 5s forwards;
    }

    @keyframes scaleUp {
        
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }

    }

    .modal-close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        background: var(--white);
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
        font-size: 18px;
        font-weight: var(--weight-500);
        padding: 5px;
        border-radius: var(--border-radius-sm);
    }

    .modal-close-btn:hover {
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
    }

    .modal-close-btn svg { stroke-width: 2px; }

    .newsletter {
        padding: 50px 30px;
        text-align: center;
    }

    .newsletter-header { margin-bottom: 20px; }

    .newsletter-title {
        color: var(--eerie-black);
        font-size: var(--fs-2);
        font-weight: var(--weight-300);
        margin-bottom: 10px;
    }

    .newsletter-desc {
        color: var(--sonic-silver);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        line-height: 1.6;
        letter-spacing: 0.3px;
    }

    .newsletter-desc span {
        font-weight: var(--weight-300);
    }

    .email-field {
        font-size: var(--fs-7);
        letter-spacing: 0.3px;
        padding: 8px 16px;
        font-weight: var(--weight-300);
        border-radius: var(--border-radius-sm);
        border: 1px solid var(--cultured-darker);
        margin-bottom: 16px;
    }

    .btn-newsletter {
        background: var(--white);
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
        font-size: var(--fs-8);
        font-weight: var(--weight-400);
        text-transform: uppercase;
        padding: 10px 15px;
        border-radius: var(--border-radius-sm);
        margin: auto;
        transition: var(--transition-timing);
    }

    .btn-newsletter:hover {
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
    }

    /* NOTIFICATION TOAST */

    .notification-toast {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: var(--white);
        max-width: 300px;
        margin-left: auto;
        border: 1px solid var(--cultured-dark);
        display: flex;
        align-items: flex-start;
        gap: 15px;
        padding: 15px;
        border-radius: var(--border-radius-md);
        box-shadow: 0 5px 20px hsla(0, 0%, 0%, 0.15);
        transform: translateX(calc(100% + 40px));
        transition: 0.5s ease-in-out;
        z-index: 5;
        animation: slideInOut 35s ease-in-out 1;
    }

    @keyframes slideInOut {
        0%,
        45%,
        100% {
            transform: translateX(calc(100% - 40px));
            opacity: 0;
            visibility: hidden;
        }
        50%,
        95% {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }
    }

     @keyframes slideInOut {
        0% {
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            visibility: hidden;
        }
        10% {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }
        90% {
            transform: translateX(calc(100% - 40px));
            opacity: 0;
            visibility: hidden;
        }
        100% {
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            visibility: hidden;
        }
     }

    .notification-toast.closed { display: none; }

    .toast-close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        color: var(--sonic-silver);
    }

    .toast-close-btn svg { stroke-width: 2px; }

    .toast-banner {
        width: 70px;
        height: 70px;
        border: 1px solid var(--cultured);
        border-radius: var(--border-radius-sm);
    }

    .toast-banner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
    }

    .toast-detail {
        width: calc(100% - 85px);
        padding-right: 10px;
    }

    .toast-title {
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
    }

    .toast-message {
        font-size: var(--fs-10);
        color: var(--onyx-darker);
        font-weight: var(--weight-300);
        margin-bottom: 8px;
    }

    /* #HEADER */

    .header-top, 
    .header-user-actions, 
    .desktop-navigation-menu { display: none; }

    .header-top { background: var(--light-pink); }

    .header-top .container {
        max-width: 100%;
        width: 100%;
        margin: 0;
    }

    .header-main {
        padding: 20px 0;
        border: 1px solid var(--cultured);
    }

    .header-logo { margin-bottom: 20px; }

    .header-logo img { margin: auto; }

    .header-search-container { position: relative; }

    .header-search-container .search-field {
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        padding: 10px 15px;
        padding-right: 50px;
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
    }

    .search-field::-webkit-search-cancel-button { display: none; }

    .search-btn {
        background: var(--white);
        position: absolute;
        top: 50%;
        right: 2px;
        transform: translateY(-50%);
        color: var(--onyx);
        font-size: 18px;
        padding: 8px 15px;
        transition: color var(--transition-timing);
    }

    .search-btn:hover { color: var(--salmon-pink); }

    .mobile-bottom-navigation {
        background: var(--eerie-black);
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 500px;
        margin: auto;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 5px 0;
        box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.25);
        z-index: 5;
    }

    .mobile-bottom-navigation .action-btn {
        position: relative;
        font-size: 26px;
        color: var(--white);
        padding: 10px;
        font-weight: var(--weight-400);
    }

    .mobile-bottom-navigation .action-btn.active {
        color: var(--soft-coral);
    }

    .mobile-bottom-navigation .count {
        background: var(--soft-coral);
        color: var(--white);
        position: absolute;
        top: 0;
        right: 0;
        font-size: 10px;
        font-weight: var(--weight-300);
        line-height: 1;
        padding: 2px 4px;
        border-radius: 10px;
    }

    .mobile-navigation-menu {
        background: var(--pastel-pink);
        position: fixed;
        top: 0;
        left: -100%;
        width: 100%;
        max-width: 360px;
        height: 100vh;
        padding: 20px;
        box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.1);
        overflow-y: scroll;
        overscroll-behavior: contain;
        visibility: hidden;
        transition: 0.5s ease;
        z-index: 20;
    }

    /* -------------------------------------------------- */

    /* .mobile-navigation-menu::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    .mobile-navigation-menu::-webkit-scrollbar-track {
        background: transparent;
    }

    .mobile-navigation-menu::-webkit-scrollbar-thumb {
        background: var(--salmon-pink);
        border-radius: 10px;
    }

    .mobile-navigation-menu::-webkit-scrollbar-thumb:hover {
        background: var(--salmon-pink);
    } */

    /* -------------------------------------------------- */

    .mobile-navigation-menu.active {
        left: 0;
        visibility: visible;
    }

    .menu-top {
        padding-bottom: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--soft-pink);
    }

    .menu-top .menu-title {
        color: var(--soft-coral);
        font-size: var(--fs-4);
        font-weight: var(--weight-600);
        text-transform: uppercase;
    }

    .menu-close-btn {
        color: var(--onyx-black);
        font-size: 22px;
    }

    .menu-close-btn svg { stroke-width: 2px; }

    .mobile-menu-category-list { margin-bottom: 30px; }

    .menu-category .accordion-menu {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .mobile-menu-category-list .menu-category { border-bottom: 1px solid var(--soft-pink); }

    .mobile-menu-category-list .menu-title {
        color: var(--onyx-black);
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        padding: 12px 0;
        text-transform: uppercase;
    }

    .accordion-menu > div {
        font-size: 14px;
    }

    .accordion-menu svg {
        color: var(--onyx-black);
        width: 18px;
        height: 18px;
    }

    .accordion-menu.active .add-icon,
    .accordion-menu .remove-icon { display: none; }

    .accordion-menu .add-icon,
    .accordion-menu.active .remove-icon { display: block; }

    .menu-category .submenu-category-list {
        margin-left: 10px;
    }

    .submenu-title {
        padding: 6px 0;
        font-size: var(--fs-7);
        color: var(--onyx);
        font-weight: var(--weight-300);
        text-transform: uppercase;
    }

    .submenu-title:hover { color: var(--davys-gray); }

    .submenu-category-list {
        max-height: 0;
        overflow: hidden;
        visibility: hidden;
        transition: 0.5s ease-in-out;
    }

    .submenu-category-list.active {
        /* max-height: 148px; */
        max-height: 1000px;
        visibility: visible;
    }

    .menu-bottom .menu-category-list { margin-bottom: 20px; }

    .menu-bottom .menu-category { border-bottom: none; }

    .menu-bottom .menu-title {
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
        text-transform: uppercase;
        padding: 12px 0;
    }

    .accordion-menu.active .caret-back { transform: rotate(-0.25turn); }

    .menu-bottom .submenu-category-list {
        padding: 0 15px;
        margin-left: 0;
    }

    .menu-bottom .submenu-category:not(:last-child) { border-bottom: 1px solid var(--salmon-pink); }

    .menu-social-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .menu-social-container .social-link {
        background: var(--pastel-pink);
        color: var(--sonic-silver);
        font-size: 14px;
        padding: 5px;
    }

    /* #BANNER */

    .banner { margin: 30px 0; }

    .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: auto hidden;
        scroll-snap-type: inline mandatory;
        overscroll-behavior-inline: contain;
    }

    .slider-item {
        position: relative;
        min-width: 100%;
        max-height: 450px;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        scroll-snap-align: start;
    }

    .slider-item .banner-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right;
    }

    .banner-content {
        background: hsla(0, 0%, 100%, 0.8);
        position: absolute;
        bottom: 25px;
        left: 25px;
        right: 25px;
        padding: 20px 25px;
        border-radius: var(--border-radius-md);
    }

    .banner-subtitle {
        color: var(--salmon-pink);
        font-size: var(--fs-7);
        font-weight: var(--weight-500);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    .banner-title {
        color: var(--eerie-black);
        font-size: var(--fs-1);
        text-transform: uppercase;
        line-height: 1;
        margin-bottom: 10px;
    }

    .banner-text { display: none; }

    .banner-btn {
        background: var(--white);
        color: var(--salmon-pink);
        border: 1px solid var(--salmon-pink);
        width: max-content;
        font-size: var(--fs-9);
        font-weight: var(--weight-600);
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: var(--border-radius-sm);
        transition: var(--transition-timing);        
    }

    .banner-btn:hover {
        color: var(--eerie-black);
        border: 1px solid var(--eerie-black);
    }

    /* #CATEGORY */

    .category { margin-bottom: 30px; }

    .category-item-container {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        overflow: auto hidden;
        scroll-snap-type: inline mandatory;
        overscroll-behavior-inline: contain;
        padding: 30px 10px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .category-item-container::-webkit-scrollbar { display: none; }

    .category-item {
        min-width: auto;
        flex: 0 0 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 0 5px;
        border: none;
        border-radius: 0;
        scroll-snap-align: start;
        background: transparent;
        box-shadow: none;
    }

    .category-img-box {
        background: var(--white);
        border: 2px solid var(--salmon-pink);
        padding: 0;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .category-item:hover .category-img-box {
        border: 2px solid var(--eerie-black);
    }

    .category-img-box img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: invert(58%) sepia(15%) saturate(1434%) hue-rotate(314deg) brightness(95%) contrast(85%);
    }

    .category-item:hover .category-img-box img {
        filter: brightness(0);
    }

    .category-content-box { width: 100%; text-align: center; }

    .category-content-flex {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        margin-bottom: 0;
    }

    .category-item-title {
        color: var(--eerie-black);
        font-size: 0.8rem;
        font-weight: var(--weight-300);
        text-transform: uppercase;
        margin: 0;
        line-height: 1.3;
        letter-spacing: 0.5px;
    }

    .category-item-amount,
    .category-btn { display: none; }

    /* #PRODUCT FEATURED */

    .product-featured { margin-bottom: 30px; }

    .product-featured .showcase-wrapper {
        display: flex;
        align-items: center;
        gap: 20px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
    }

    .product-featured .showcase-container {
        min-width: 100%;
        padding: 15px;
        border: 1px solid var(--cultured-darker);
        scroll-snap-align: start;
    }

    .product-featured .showcase-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .product-featured .showcase-content { margin-top: 10px; }

    .product-featured .showcase-title {
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        color: var(--eerie-black);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-transform: uppercase;
        margin-bottom: 3px;
    }

    .product-featured .showcase-desc {
        color: var(--sonic-silver);
        font-size: var(--fs-9);
        font-weight: var(--weight-300);
        margin-bottom: 10px;
    }

    .product-featured .price-box {
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        display: flex;
        gap: 10px;
        margin-bottom: 5px;
    }

    .product-featured .price {
        color: var(--text-dark);
        font-weight: var(--weight-300);
    }

    .product-featured del {
        color: var(--sonic-silver);
        font-weight: var(--weight-300);
    }

    .product-featured .add-cart-btn {
        background: var(--light-pink);
        padding: 8px 25px;
        color: var(--onyx-dark);
        font-size: var(--fs-9);
        font-weight: var(--weight-400);
        border: 0.2px solid var(--light-pink);
        text-transform: uppercase;
        margin-bottom: 15px;
        transition: var(--transition-timing);
    }

    .product-featured .add-cart-btn:hover {
        background: var(--white);
        border-color: var(--onyx-dark);
    }

    .product-featured .showcase-status { margin-bottom: 15px; }

    .product-featured .showcase-status .wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--eerie-black);
        font-size: var(--fs-9);
        font-weight: var(--weight-300);
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .product-featured .showcase-status-bar {
        background: var(--cultured);
        position: relative;
        height: 10px;
        border-radius: 5px;
    }

    .product-featured .showcase-status-bar::before {
        position: absolute;
        content: "";
        top: 3px;
        left: 3px;
        height: 3px;
        width: 40%;
        background: var(--soft-coral);
        border-radius: 4px;
    }

    .product-featured .countdown-desc {
        color: var(--text-dark);
        font-size: var(--fs-10);
        font-weight: var(--weight-300);
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .product-featured .countdown {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
    }

    .product-featured .countdown-content {
        padding: 5px;
        background: var(--cultured);
        text-align: center;
    }

    .product-featured .display-number {
        color: var(--text-dark);
        font-size: var(--fs-5);
        font-weight: var(--weight-300);
        min-width: 40px;
    }

    .product-featured .display-text {
        color: var(--text-dark);
        font-size: var(--fs-11);
    }

    /* #LISTA DE PRODUCTOS */

    .product-main { margin-bottom: 30px; }

    /* .product-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 25px;
    } */

    .product-grid {
        display: grid;
        grid-template-columns: (2, 1fr);
        gap: 12px;
    }

    .product-grid .showcase {
        border: 1px solid var(--cultured-darker);
        overflow: hidden;
        padding: 8px;
        transition: var(--transition-timing);
    }

    .product-grid .showcase:hover { box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.05); }

    .product-grid .showcase-banner {
        position: relative;
        overflow: hidden;
    }

    .product-grid .product-img {
        width: 100%;
        height: 250px;
        display: block;
        object-fit: cover;
        transition: var(--transition-timing);
    }

    .product-grid .product-img.hover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 2;
        opacity: 0;
    }

    .product-grid .product-img.default {
        position: relative;
        z-index: 1;
    }

    .product-grid .showcase-banner:hover .product-img.hover { opacity: 1; }

    .product-grid .showcase-banner:hover .product-img.default { opacity: 0; }

    .product-grid .showcase-badge {
        position: absolute;
        top: 15px;
        left: 15px;
        background: var(--ocean-green);
        font-size: var(--fs-9);
        font-weight: var(--weight-400);
        color: var(--white);
        padding: 0 8px;
        border-radius: var(--border-radius-sm);
        z-index: 3;
    }

    .product-grid .showcase-badge.angle {
        position: absolute;
        top: 18px;
        left: -32px;
        width: 120px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-45deg);
        transform-origin: center;
        margin: 0;
        padding: 0;
        font-size: 10px;
        line-height: 1;
        font-weight: var(--weight-500);
        text-transform: uppercase;
        z-index: 3;
    }

    .product-grid .showcase-badge.black { background: var(--eerie-black); }

    .product-grid .showcase-badge.pink { background: var(--salmon-pink); }

    .product-grid .showcase-actions {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        transform: translateX(50px);
        transition: var(--transition-timing);
        z-index: 3;
    }

    .product-grid .showcase-banner:hover .showcase-actions { transform: translateX(0); }

    .product-grid .btn-action {
        background: var(--light-pink);
        color: var(--sonic-silver);
        margin-bottom: 5px;
        border: 1px solid var(--light-pink);
        padding: 5px;
        transition: var(--transition-timing);
    }

    .product-grid .btn-action:hover {
        background: var(--white);
        color: var(--sonic-silver);
        border-color: var(--sonic-silver);
    }

    .product-grid .showcase-content { padding: 15px 20px 0; }

    .product-grid .showcase-category {
        color: var(--soft-coral);
        font-size: var(--fs-9);
        font-weight: var(--weight-400);
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .product-grid .showcase-title {
        color: var(--sonic-silver);
        font-size: var(--fs-7);
        text-align: center;
        font-weight: var(--weight-400);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 1px;
    }

    .product-grid .price-box {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: var(--fs-9);
        font-weight: var(--weight-300);
        color: var(--text-dark);
        margin-bottom: 3px;
    }

    .product-grid .price { font-weight: var(--weight-300); }

    .product-grid del { color: var(--sonic-silver); }

    .product-grid .add-cart-btn {
        display: block;
        width: 90%;
        max-width: 100%;
        background: var(--light-pink);
        color: var(--onyx-darker);
        padding: 5px 10px;
        margin: 5px auto 25px;
        font-size: var(--fs-9);
        font-weight: var(--weight-400);
        border: 0.2px solid var(--light-pink);
        text-transform: uppercase;
    }

    .product-grid .add-cart-btn:hover {
        background: var(--white);
        border: 0.1px solid var(--onyx-darker);
    }

    /* #TESTIMONIOS */

    .testimonials-box { margin-bottom: 50px; }

    .testimonial {
        display: flex;
        align-items: flex-start;
        gap: 15px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
    }

    .testimonial-card {
        position: relative;
        min-width: 100%;
        min-height: 290px;
        padding: 18px 18px 25px;
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
        text-align: left;
        background: var(--white);
        margin-bottom: 5px;
        scroll-snap-align: start;
    }

    .testimonial-banner {
        width: 45px;
        height: 45px;
        margin: 0 10px 0 0;
        border-radius: 50%;
        object-fit: cover;
        float: left;
    }

    .testimonial-name {
        font-size: var(--fs-10);
        font-weight: var(--weight-400);
        color: var(--eerie-black);
        text-transform: capitalize;
    }

    .testimonial-title {
        margin: 0;
        font-size: var(--fs-10);
        font-weight: var(--weight-300);
        color: var(--onyx);
        line-height: 1.2;
    }
    
    .testimonial-stars {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .testimonial-stars svg {
        color: var(--sandy-brown);
        width: 14px;
        height: 14px;
        fill: var(--sandy-brown);
    }

    .testimonial-card::after {
        content: "";
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--cultured-darker);
    }

    .quotation {
        position: absolute;
        top: 20px;
        right: 18px;
        width: 18px;
        height: 18px;
        color: var(--onyx-dark);
    }

    .testimonial-desc {
        clear: both;
        max-width: 100%;
        margin: 11px 0 0;
        color: var(--eerie-black);
        font-size: var(--fs-9);
        font-weight: var(--weight-300);
        line-height: 1.75;
        text-align: left;
    }

    /* #BLOG */

    .blog { margin-bottom: 30px; }

    .blog-container {
        display: flex;
        align-items: flex-start;
        gap: 15px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
    }

    .blog-card {
        min-width: 100%;
        scroll-snap-align: start;
    }

    .blog-banner {
        width: 100%;
        border-radius: var(--border-radius-md);
        margin-bottom: 20px;
    }

    .blog-category {
        width: max-content;
        color: var(--salmon-pink);
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
    }

    .blog-title {
        color: var(--eerie-black);
        font-size: var(--fs-5);
        font-weight: var(--weight-300);
        line-height: 1.4;
        margin-bottom: 5px;
        transition: var(--transition-timing);
    }

    .blog-title:hover { color: var(--salmon-pink); }

    .blog-meta {
        color: var(--sonic-silver);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
    }

    .blog-meta cite {
        font-style: normal;
        color: var(--davys-gray);
    }

    /* #FOOTER */

   footer {
        background: var(--light-pink);
        padding: 20px 0;
    }

    /**
      *footer nav 
      */

    .footer-nav {
        border-bottom: 1px solid var(--onyx);
        padding-bottom: 10px;
        margin-bottom: 10px;
    }

    .logo-img {
        max-width: 140px;
        height: auto;
        margin-bottom: 12px;
    }

    .footer-nav-item .content-text {
        font-size: var(--fs-7);
        color: var(--onyx-darker);
        font-weight: var(--weight-300);
        max-width: 250px;
    }

    .footer-nav .container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 30px;
    }

    .footer-nav-list {
        flex: 1;
    }

    .footer-nav-list:not(:last-child) { margin-bottom: 8px; }

    .footer-nav .nav-title {
        position: relative;
        color: var(--onyx-black);
        font-size: var(--fs-7);
        font-weight: var(--weight-400);
        text-transform: uppercase;
        margin-bottom: 9px;
        padding-bottom: 3px;
    }

    .footer-nav .nav-title::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        background: var(--soft-coral);
        width: 60px;
        height: 1px;
    }

    .footer-nav-item { padding: 2px 0; }

    .footer-nav-link,
    .footer-nav-item .content {
        width: max-content;
        color: var(--onyx-darker);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        transition: var(--transition-timing);
    }

    .footer-nav-item.flex {
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .footer-nav-item .content {
        font-style: normal;
        font-weight: var(--weight-300);
        margin-bottom: 5px;
    }

    .footer-nav-item .icon-box {
        color: var(--onyx-darker);
        font-size: 20px;
    }

    .footer-nav-item .icon-box svg { width: 20px; height: 20px; }

    .footer-bottom {
        margin-bottom: 50px;
        text-align: center;
    }

    .payment-img {
        max-width: 335px;
        width: 100%;
        margin: auto;
        margin-bottom: 15px;
    }

    .copyright {
        color: var(--onyx-darker);
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
        text-transform: capitalize;
        letter-spacing: 1.2px;
    }

    .copyright a {
        display: inline;
        color: inherit;
    }

    /* #AUTH - REGISTRO, VERIFICACIÓN PIN Y LOGIN */

    .auth-section {
        padding: 30px 0;
    }

    .auth-card {
        max-width: 900px;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
        display: grid;
        grid-template-columns: 55% 45%;
        background: var(--white);
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
    }

    .auth-content { padding: 40px 45px; }

    .auth-card .title { margin-bottom: 10px; }

    .auth-desc {
        margin-bottom: 25px;
        text-align: center;
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        line-height: 1.5;
        color: var(--onyx-darker);
    }

    .input-group { margin-bottom: 12px; }

    .input-label {
        display: block;
        margin-bottom: 4px;
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
        color: var(--onyx-black);
        letter-spacing: 0.3px;
    }

    .input-field {
        width: 100%;
        padding: 12px 15px;
        background: var(--white);
        border: 1px solid var(--cultured-darker);
        border-radius: var(--border-radius-md);
        font-size: var(--fs-7);
        font-weight: var(--weight-300);
    }

    .show-password {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: -4px;
        margin-bottom: 15px;
    }

    .show-password input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        cursor: pointer;
        border: 1px solid var(--onyx-darker);
        border-radius: 3px;
        background: var(--white);
        display: grid;
        place-content: center;

    }
    
    .show-password input[type="checkbox"]:checked {
        background: var(--light-pink);
        border-color: var(--light-pink);
    }

    .show-password input[type="checkbox"]:checked::before {
        content: "✓";
        color: var(--onyx-black);
        font-size: 12px;
        font-weight: var(--weight-700);
        line-height: 1;
    }

    .show-password label {
        color: var(--onyx-darker);
        font-size: var(--fs-8);
        font-weight: var(--weight-300);
        cursor: pointer;
    }

    .auth-error {
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 8px 15px;
        background: hsla(0, 100%, 70%, 0.1);
        border: 1px solid var(--bittersweet);
        color: var(--bittersweet);
        font-size: var(--fs-7);
        font-weight: var(--weight-400);
        text-align: center;
    }

    .input-field--pin {
        align-items: center;
        font-size: var(--fs-6);
        font-weight: var(--weight-400);
        letter-spacing: 8px;
    }

    .auth-btn {
        display: block;
        width: 100%;
        padding: 7px 18px;
        margin-bottom: 6px;
        background: var(--light-pink);
        color: var(--onyx-darker);
        border: 0.2px solid var(--light-pink);
        font-size: var(--fs-8);
        font-weight: var(--weight-400);
        text-align: center;
        text-transform: uppercase;
        cursor: pointer;
    }

    .opacity-btn { opacity: 0.5; }

    .auth-footnote {
        margin-top: 10px;
        text-align: center;
        font-size: var(--fs-6);
        font-weight: var(--weight-300);
        line-height: 1.5;
        color: var(--onyx-very-dark);
    }

    .auth-link {
        color: var(--salmon-pink);
        font-weight: var(--weight-400);
        display: inline;
    }

    .auth-link:hover {
        color: var(--onyx-darker);
        text-decoration: underline;
    }

    .spinner {
        margin: 2px auto;
        width: 50px;
        height: 40px;
        text-align: center;
        font-size: 10px;
    }

    .spinner > div {
        background-color: var(--salmon-pink);
        height: 100%;
        width: 6px;
        display: inline-block;
        
        -webkit-animation: sk-stretchdelay 1.2s infinite ease-in-out;
        animation: sk-stretchdelay 1.2s infinite ease-in-out;
    }

    .spinner .rect2 {
        -webkit-animation-delay: -1.1s;
        animation-delay: -1.1s;
    }

    .spinner .rect3 {
        -webkit-animation-delay: -1.0s;
        animation-delay: -1.0s;
    }

    .spinner .rect4 {
        -webkit-animation-delay: -0.9s;
        animation-delay: -0.9s;
    }

    .spinner .rect5 {
        -webkit-animation-delay: -0.8s;
        animation-delay: -0.8s;
    }

    @-webkit-keyframes sk-stretchdelay {
        0%, 40%, 100% { -webkit-transform: scaleY(0.4) }  
        20% { -webkit-transform: scaleY(1.0) }
    }

    @keyframes sk-stretchdelay {
        0%, 40%, 100% { 
            transform: scaleY(0.4);
            -webkit-transform: scaleY(0.4);
        }  20% { 
            transform: scaleY(1.0);
            -webkit-transform: scaleY(1.0);
        }
    }

    .hidden-spinner {
        display: none;
    }

    .auth-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100%;
        padding: 40px 20px 30px;
        background: var(--pale-pink);
    }

    .auth-side-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    .auth-logo {
        margin-bottom: 10px;
        font-size: var(--fs-2);
        font-weight: var(--weight-400);
        letter-spacing: 1px;
        text-align: center;
        color: var(--onyx-black);
    }

    .auth-img {
        display: block;
        width: 100%;
        max-width: 350px;
        height: auto;
        margin: 0 auto;
    }

    /* #RESPONSIVE */
    
    /* PRODUCTOS: 2 COLUMNAS EN MOVIL */
    @media (max-width: 479px) {

        .product-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .product-grid .showcase {
            padding: 5px;
        }

        .product-grid .product-img {
            height: 160px;
        }

        .product-grid .showcase-content {
            padding: 10px 5px 0;
        }

        .product-grid .showcase-title {
            font-size: 0.68rem;
            letter-spacing: 0.5px;
        }

        .product-grid .showcase-category {
            font-size: 0.65rem;
        }

        .product-grid .price-box {
            font-size: 0.68rem;
            gap: 5px;
        }

        .product-grid .add-cart-btn {
            width: 100%;
            margin: 5px auto 15px;
            padding: 5px;
            font-size: 0.65rem;
        }
    }
    /**
      * Diseño adaptable para pantallas mayores de 480px
      */
    
    @media (min-width: 480px) {
        /**
        * #CUSTOM PROPERTY
        */

        :root {
            /**
            * typography 
            */
            --fs-1: 1.875rem;
        }
        /**
        * #HEADER
        */
        .header-top {
            display: block;
            padding: 10px 0;
            border-bottom: 1px solid var(--cultured);
        }

        .header-social-container,
        .header-top-actions { display: none; }

        .header-alert-news {
            color: var(--onyx);
            font-size: var(--fs-9);
            text-transform: uppercase;
        }

        .header-alert-news b { font-weight: var(--weight-400); }

        .header-main { padding: 25px 0; }

        /**
        * #BANNER
        */

        .slider-item { aspect-ratio: 5 / 3; }

        .banner-content {
            top: 50%;
            right: auto;
            bottom: auto;
            transform: translateY(-50%);
            max-width: 320px;
        }

        .banner-subtitle { --fs-7: 1rem; }

        .banner-text {
            display: block;
            color: var(--sonic-silver);
            font-size: var(--fs-7);
            font-weight: var(--weight-500);
            margin-bottom: 10px;
        }

        .banner-text b { font-size: var(--fs-2); }

        .banner-btn { padding: 7px 20px; }

        /**
        * #PRODUCT 
        */

        .product-grid {
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /**
        * #TESTIMONIAL
        */

        .testimonial { gap: 30px; }

        .testimonial-card { min-width: calc(50% - 15px); }

        .cta-btn { --fs-9: 1rem; }

        /**
        * #FOOTER
        */

        .footer-nav .container {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .footer-nav-link {
            width: 100%;
        }

        .content-text {
            max-width: 100%;
        }

        .copyright { --fs-8: 0.875rem; }

    }

    @media (max-width: 480px) {

        /**
        * #FORMULARIO DE REGISTRO
        */

        .auth-section { padding: 25px 0; }

        .auth-content { padding: 30px 20px; }

        .auth-card { border-radius: var(--border-radius-md); }

        .input-field--pin {
            font-size: var(--fs-6);
            letter-spacing: 6px;
        }

        .auth-side {
            display: none;
        }
    }

    @media screen and (max-width: 570px) {
        .footer-nav .container {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .footer-nav-link {
            width: 100%;
        }

        .content-text {
            max-width: 100%;
        }
    }

    /**
     * Diseño adaptable para pantallas mayores de 570px
     */

    @media (min-width: 570px) {

        /**
        * #HEADER
        */

        .header-top .container,
        .header-main .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo { margin-bottom: 0; }

        .header-top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-top-actions select {
            border: none;
            display: block;
            min-width: 80px;
            padding: 5px 0;
            background: var(--light-pink);
            font: inherit;
            color: var(--onyx-dark);
            font-size: var(--fs-8);
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-timing);
        }

        .header-search-container { min-width: 300px; }

        /**
        * #BANNER
        */

        .slider-item { aspect-ratio: 4 / 2; }

        .banner-content { background: none; }

        /**
        * #CATEGORY
        */

        .category-item-container { gap: 30px; }

        .category-item { min-width: calc(50% - 15px); }

        /**
        * #PRODUCT
        */
        
        .product-featured .showcase-container {
            width: 100%;
        }

        .product-featured .showcase-img {
            max-width: 450px;
            margin: auto;
        }

        .product-featured .countdown { gap: 20px; }

        /**
        * #TESTIMONIAL
        */

        .testimonial { min-width: 50% - 7.5px; }

        /**
        * #BLOG
        */

        .blog-container { gap: 30px; }

        .blog-card { min-width: calc(50% - 15px); }

        /**
        * #FOOTER
        */

        .footer-nav .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        
        .footer-nav-list:nth-child(3) {
            grid-column: span 2;
        }
