<section class="auth-section">

    <div class="container">
        <div class="auth-card">
            <div class="auth-content">
                <h2 class="title">Iniciar sesión</h2>
                <p class="auth-desc"><b>MAJOS CAKE MEDELLÍN</b> y disfruta de nuestros productos</p>
                <form class="auth-form" autocomplete="off" id="form-login">
                    <div class="input-group">
                        <label for="login-username" class="input-label">Usuario</label>
                        <input type="text" id="login-username" name="username" class="input-field"
                            placeholder="Correo electrónico o número de celular" aria-required="true">
                    </div>
                    <div class="input-group">
                        <label for="login-password" class="input-label">Contraseña</label>
                        <input type="password" id="login-password" name="password" class="input-field"
                            placeholder="Ingresar contraseña" aria-required="true">
                    </div>
                    <div class="show-password">
                        <input type="checkbox" id="show-login-password">
                        <label for="show-login-password">mostrar contraseña</label>
                    </div>
                    <button type="submit" class="auth-btn opacity-btn">Iniciar sesión</button>
                    <p class="auth-footnote"><a href="#" class="auth-link">¿Olvidaste tu contraseña?</a></p>
                    <p class="auth-footnote">¿No tiene una cuenta? <a href="/registro" class="auth-link"
                            id="auth-link" data-link>Registrate</a></p>
                </form>
                <div id="spinner" class="hidden-spinner">
                    <div class="spinner">
                        <div class="rect1"></div>
                        <div class="rect2"></div>
                        <div class="rect3"></div>
                        <div class="rect4"></div>
                        <div class="rect5"></div>
                    </div>
                </div>
            </div>
            <div class="auth-side">
                <div class="auth-logo">
                    MAJOS CAKE MEDELLÍN
                </div>
                <div class="auth-side-content">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face"
                        alt="Imagen de formulario de registro" class="auth-img">
                </div>
            </div>
        </div>
    </div>

</section>
