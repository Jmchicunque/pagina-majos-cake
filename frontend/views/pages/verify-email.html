
<section class="auth-section">

    <div class="container">
        <div class="auth-card">

            <div class="auth-content">
                <h2 class="title">Verificar cuenta</h2>
                <p class="auth-desc">
                    Para completar tu registro en <b>MAJOS CAKE MEDELLÍN</b>, necesitamos verificar tu correo electrónico.
                </p>
                <p class="auth-desc">
                    Introduce el código de seis dígitos que enviamos a tu correo electrónico.
                </p>
                <form
                    class="auth-form" id="form-verification" autocomplete="off">
                    <div class="input-group">
                        <label for="verification-code" class="input-label">Código de verificación</label>
                        <input type="text" id="verification-code" name="verificationCode" class="input-field" placeholder="Ej. 123456" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-required="true">
                    </div>
                    <p class="auth-desc">
                        El código caduca en 10 minutos.
                    </p>
                    <button type="submit" id="verify-code-button" class="auth-btn opacity-btn">Verificar código</button>
                    <button type="button" id="resend-verification-code"class="auth-btn">Reenviar código</button>

                    <p class="auth-footnote">¿Te equivocaste de correo?
                        <a href="/registro" class="auth-link" data-link>Volver al registro</a>
                    </p>

                </form>

                <div id="spinner" class="hidden-spinner">
                    <div class="spinner">
                        <div class="rect1"></div>
                        <div class="rect2"></div>
                        <div class="rect3"></div>
                        <div class="rect4"></div>
                        <div class="rect5"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</section>
