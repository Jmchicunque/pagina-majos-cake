<section class="auth-section hidden-section" id="verify-code-section">

    <div class="container">
        <div class="auth-card">
            <div class="auth-content">
                <h2 class="title">Verifica tu cuenta</h2>
                <p class="auth-desc">Para confirmar que eres tú, ingresa el código de 6 dígitos que enviamos a tu correos</p>

                <form class="auth-form" autocomplete="off" id="form-verify-code">
                    <div class="input-group">
                        <label for="verify-code" class="input-label">Código de verificación</label>
                        <input type="text" id="verify-code" name="code" class="input-field input-field--pin">
                    </div>
                </form>

            </div>
        </div>
    </div>

</section>
