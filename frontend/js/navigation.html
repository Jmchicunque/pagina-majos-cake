<script>
    
    window.Router = class Router {
        constructor(routes) {
            this.routes = routes;
            this.init();
        }

        init () {
            window.addEventListener("hashchange", () => {
                this.handleRouter();
            });

            document.addEventListener("click", (e) => {
                const link = e.target.closest("[data-link]");

                if (!link) return;

                e.preventDefault();

                this.navigateTo(link.getAttribute("href"));

            });

            this.handleRouter();
        }

        navigateTo (url) {
            localStorage.setItem("currentRoute", url);
            window.location.hash = url;
        }

        pathToRegex (path) {
            return new RegExp(
                "^" + 
                path
                    .replace(/\//g, "\\/")
                    .replace(/:\w+/g, "([^/]+)") +
                    "$"
            );
        }

        getParams (route, result) {
            if (!result) return;

            const values = result.slice(1);

            const keys = [...route.path.matchAll(/:(\w+)/g)].map(match => match[1]);

            return Object.fromEntries(
                keys.map((key, index) => [
                    key,
                    values[index]
                ])
            );
        }

        async handleRouter () {
               const applicationMode = localStorage.getItem("applicationMode");

                if (applicationMode === "admin") {

                    const token = localStorage.getItem("authToken");

                    if (!token) {
                        localStorage.removeItem("applicationMode");
                        return;
                    }

                    google.script.run
                        .withSuccessHandler(function (panelResponse) {

                            if (!panelResponse.success) {

                                localStorage.removeItem("applicationMode");
                                localStorage.removeItem("authToken");
                                localStorage.removeItem("authUser");

                                window.location.hash = "/";

                                return;
                            }

                            const content = document.querySelector("#content");

                            if (!content) {
                                console.error("NO se encontró el contenedor #content");
                                return;
                            }

                            window.mainApplication = content;

                            document.body.innerHTML = panelResponse.html;

                            const adminScript = document.createElement("script");
                            adminScript.textContent = panelResponse.js;
                            document.body.appendChild(adminScript);

                            document.body.classList.remove("main-mode");
                            document.body.classList.add("admin-mode");
                            document.body.classList.remove("application-loading");

                        })
                        .withFailureHandler(function (error) {
                            console.error("ERROR AL RESTAURAR EL PANEL ADMINISTRATIVO:",error);
                            localStorage.removeItem("applicationMode");
                        })
                        .getAdminApplication(token);

                    return;
                }

            let pathname = window.location.hash.substring(1);

            if (pathname === "") {
                pathname = localStorage.getItem("currentRoute") || "/";
            }

            let match = null;

            for (const route of this.routes) {
                const result = pathname.match(this.pathToRegex(route.path));

                if (result) {
                    match = {
                        route,
                        result
                    };
                    break;
                }
            }

            if (!match) {
                match = {
                    route: {
                        path: "/404",
                        page: "frontend/views/pages/404"
                    },
                    result: null
                }
            }

            const params = this.getParams(
                match.route,
                match.result
            );

            const app = document.querySelector("#app");

            if (!app) return;

            app.innerHTML = `
                <div class="page-loader">
                    Cargando...
                </div>
            `;

            google.script.run
                .withSuccessHandler(html => {
                    app.innerHTML = html;

                    if (match.route.initialize) {
                        match.route.initialize(params);
                    }
                    document.body.classList.remove("application-loading");
                })
                .withFailureHandler(error => {
                    console.error(
                        "Error al cargar la página:",
                        error.message
                    );

                    app.innerHTML = `
                        <h1>Error</h1>
                        <p>No se pudo cargar la página.</p>
                    `;
                })
                .getPage(match.route.page);
        }

    }

    const routes = [
        {
            path: "/",
            page: "frontend/views/pages/home"
        },
        {
            path: "/login",
            page: "frontend/views/pages/login",
            initialize: initializeLogin
        },
        {
            path: "/registro",
            page: "frontend/views/pages/register",
            initialize: initializeRegister
        },
        {
            path: "/verify-account",
            page: "frontend/views/pages/verify-email",
            initialize: initializeVerifyAccount
        },
        {
            path: "/dashboard",
            page: "frontend/views/pages/dashboard",
            initialize: initializeDashboard
        },
        {
            path: "/404",
            page: "frontend/views/pages/404"
        }
    ];

    const router = new Router(routes);

    function restoreMainApplication() {
        window.location.reload();
    }


</script>
